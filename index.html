<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101b3b">
  <meta name="description" content="לומדים במדבר — מערכת לימוד וחידונים על במדבר פרקים ט׳–י״ב">
  <title>לומדים במדבר | מערכת לימוד וחידונים</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172342;
      --muted: #66718b;
      --navy: #101b3b;
      --navy-2: #172653;
      --blue: #4778d7;
      --blue-soft: #eaf1ff;
      --purple: #7860ce;
      --gold: #d6a94c;
      --gold-soft: #fff6df;
      --teal: #269b99;
      --line: #e7ebf4;
      --surface: rgba(255,255,255,.94);
      --shadow: 0 16px 44px rgba(21,35,75,.10);
      --shadow-small: 0 7px 22px rgba(21,35,75,.08);
      --radius-xl: 27px;
      --radius-lg: 21px;
      --radius-md: 16px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh; overflow-x: hidden;
      color: var(--ink); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(ellipse at 85% 4%, rgba(113,95,205,.18), transparent 35%),
        radial-gradient(ellipse at 5% 32%, rgba(66,133,221,.13), transparent 34%),
        linear-gradient(155deg, #f3f6ff 0%, #f9faff 44%, #eef3fc 100%);
    }
    button { font: inherit; }
    button:focus-visible { outline: 3px solid rgba(71,120,215,.48); outline-offset: 3px; }
    .ambient { position: fixed; inset: auto auto -150px -120px; width: 330px; height: 330px; border-radius: 50%; background: rgba(120,96,206,.07); filter: blur(4px); pointer-events:none; z-index:-1; }
    .topbar {
      position: sticky; top: 0; z-index: 20; padding: max(10px, env(safe-area-inset-top)) 16px 10px;
      background: rgba(248,250,255,.84); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(226,232,245,.75);
    }
    .topbar-inner { max-width: 920px; margin: 0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:43px; }
    .brand { display:flex; align-items:center; gap:10px; border:0; background:transparent; color:var(--navy); padding:3px 0; cursor:pointer; text-align:right; }
    .brand-mark { width:36px; height:36px; border-radius:12px; display:grid; place-items:center; color:white; font-size:19px; background:linear-gradient(145deg,#233a78,#7459c5); box-shadow:0 6px 15px rgba(52,65,142,.22); }
    .brand-name { font-size:15px; font-weight:850; letter-spacing:-.3px; }
    .top-actions { display:flex; align-items:center; gap:8px; }
    .top-home { min-height:40px; padding:0 13px; border:1px solid #e2e7f2; border-radius:13px; background:#fff; color:#34415f; font-size:13px; font-weight:750; cursor:pointer; }
    .top-home:active,.btn:active,.chapter-card:active,.choice-card:active { transform:scale(.985); }
    main { max-width:920px; margin:0 auto; padding:20px 15px calc(38px + var(--safe-bottom)); }
    .screen { animation: enter .26s ease both; }
    @keyframes enter { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .hero {
      position:relative; overflow:hidden; border-radius:30px; padding:27px 23px 24px; color:white;
      background:linear-gradient(125deg,#111d40 0%,#1b3265 54%,#594b9f 100%); box-shadow:0 19px 44px rgba(26,42,91,.20);
      min-height:220px;
    }
    .hero:before,.hero:after { content:""; position:absolute; border:1px solid rgba(255,255,255,.11); border-radius:50%; pointer-events:none; }
    .hero:before { width:250px;height:250px; left:-75px;top:-125px; }
    .hero:after { width:180px;height:180px; left:8px;top:-85px; }
    .hero-content { position:relative; z-index:1; max-width:540px; }
    .eyebrow { display:inline-flex; align-items:center; gap:7px; padding:7px 11px; border:1px solid rgba(255,255,255,.20); border-radius:999px; background:rgba(255,255,255,.09); color:#f4e5b9; font-size:11px; font-weight:800; letter-spacing:.35px; }
    .hero h1 { margin:14px 0 7px; font-size:clamp(34px,8.5vw,49px); line-height:1.08; letter-spacing:-1.6px; font-weight:900; }
    .hero p { margin:0; max-width:480px; color:rgba(245,248,255,.82); font-size:14px; line-height:1.75; }
    .hero-emblem { position:absolute; left:18px; bottom:7px; font-size:104px; line-height:1; opacity:.16; filter:grayscale(1); transform:rotate(-10deg); }
    .hero-bottom { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:17px; }
    .hero-pill { font-size:11px; color:#f5f6ff; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.12); border-radius:999px; padding:6px 10px; }
    .section-head { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin:27px 2px 14px; }
    .section-head h2 { margin:0; font-size:20px; line-height:1.25; color:var(--navy); letter-spacing:-.45px; }
    .section-head p { margin:5px 0 0; color:var(--muted); font-size:12px; line-height:1.5; }
    .section-note { font-size:11px; font-weight:750; color:#7b86a0; white-space:nowrap; }
    .chapter-grid { display:grid; grid-template-columns:1fr; gap:12px; }
    .chapter-card {
      position:relative; display:flex; align-items:center; gap:14px; width:100%; min-height:112px; padding:16px;
      text-align:right; border:1px solid rgba(226,232,245,.95); border-radius:22px; background:var(--surface); box-shadow:var(--shadow-small);
      cursor:pointer; transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease; color:var(--ink); overflow:hidden;
    }
    .chapter-card:hover { transform:translateY(-2px); box-shadow:var(--shadow); border-color:#d7def0; }
    .chapter-icon { flex:0 0 58px; width:58px; height:58px; display:grid; place-items:center; border-radius:18px; font-size:26px; background:var(--tint); }
    .chapter-copy { min-width:0; flex:1; }
    .chapter-number { display:block; color:var(--accent); font-weight:900; font-size:12px; margin-bottom:4px; }
    .chapter-copy strong { display:block; font-size:17px; line-height:1.35; font-weight:850; letter-spacing:-.3px; }
    .chapter-copy small { display:block; margin-top:4px; color:var(--muted); font-size:11px; line-height:1.45; }
    .chapter-arrow { color:#9aa4ba; font-size:22px; padding:0 2px; }
    .personal-best { position:absolute; left:14px; bottom:9px; font-size:10px; font-weight:750; color:#8a7190; background:#f7f2ff; border-radius:999px; padding:4px 7px; }
    .tone-blue { --accent:#4778d7; --tint:#eaf1ff; }
    .tone-purple { --accent:#7860ce; --tint:#f0edff; }
    .tone-gold { --accent:#b78328; --tint:#fff5df; }
    .tone-teal { --accent:#269b99; --tint:#e6f7f5; }
    .home-foot { margin-top:16px; padding:14px 16px; border-radius:17px; border:1px solid rgba(225,231,243,.9); background:rgba(255,255,255,.63); display:flex; align-items:center; gap:11px; color:#69758f; font-size:11px; line-height:1.6; }
    .home-foot span:first-child { font-size:20px; }
    .page-heading { margin:4px 2px 19px; }
    .page-heading .kicker { color:#6e7b9a; font-weight:800; font-size:11px; letter-spacing:.45px; }
    .page-heading h1 { margin:6px 0 6px; color:var(--navy); font-size:clamp(27px,6vw,36px); line-height:1.22; font-weight:900; letter-spacing:-.8px; }
    .page-heading p { margin:0; color:var(--muted); font-size:13px; line-height:1.7; }
    .chapter-banner { display:flex; align-items:center; gap:14px; padding:18px; margin-bottom:17px; border-radius:22px; color:white; background:linear-gradient(120deg,#15254e,#3e4a87 70%,#6956a8); box-shadow:0 13px 30px rgba(35,47,103,.14); }
    .chapter-banner .banner-icon { width:54px;height:54px;border-radius:17px;display:grid;place-items:center;background:rgba(255,255,255,.13);font-size:26px;flex:none; }
    .chapter-banner small { color:#d7def5; font-size:11px; font-weight:750; }
    .chapter-banner h1 { margin:3px 0 0; font-size:22px; line-height:1.3; font-weight:900; }
    .choice-grid { display:grid; grid-template-columns:1fr; gap:13px; }
    .choice-card { display:flex; gap:15px; align-items:flex-start; width:100%; padding:20px 17px; text-align:right; border:1px solid #e4e9f4; border-radius:22px; background:rgba(255,255,255,.95); box-shadow:var(--shadow-small); color:var(--ink); cursor:pointer; transition:transform .16s ease,box-shadow .16s ease; }
    .choice-card:hover { transform:translateY(-2px); box-shadow:var(--shadow); }
    .choice-icon { width:54px;height:54px;flex:none;border-radius:17px;display:grid;place-items:center;font-size:24px;background:var(--choice-tint);color:var(--choice-accent); }
    .choice-text { flex:1; min-width:0; }
    .choice-text strong { display:block; margin:2px 0 5px; font-size:17px; font-weight:850; }
    .choice-text span { display:block; color:var(--muted); font-size:12px; line-height:1.65; }
    .choice-meta { display:flex; flex-wrap:wrap; gap:6px; margin-top:11px; }
    .mini-tag { display:inline-flex; align-items:center; padding:4px 8px; border-radius:999px; background:#f2f5fb; color:#687591; font-size:10px; font-weight:750; }
    .btn-row { display:flex; flex-wrap:wrap; gap:9px; margin-top:23px; }
    .btn { min-height:52px; border:0; border-radius:15px; padding:0 18px; display:inline-flex; align-items:center; justify-content:center; gap:8px; font-size:13px; font-weight:850; cursor:pointer; transition:transform .14s ease,filter .14s ease,background .14s ease; }
    .btn-primary { color:white; background:linear-gradient(115deg,#274d9a,#6556bd); box-shadow:0 8px 19px rgba(57,75,160,.19); }
    .btn-secondary { color:#354363; background:#fff; border:1px solid #e0e6f1; }
    .btn-ghost { color:#61708e; background:transparent; border:1px solid #e2e7f1; }
    .btn:disabled { opacity:.55; cursor:not-allowed; transform:none; }
    .study-group { margin:21px 0 0; }
    .group-title { display:flex; align-items:center; gap:9px; margin:0 2px 11px; color:#344366; font-size:15px; font-weight:900; }
    .group-title:after { content:""; height:1px; background:#dfe5f0; flex:1; }
    .study-card { overflow:hidden; margin-bottom:10px; border:1px solid #e3e9f3; border-radius:18px; background:rgba(255,255,255,.94); box-shadow:0 5px 15px rgba(25,43,86,.045); }
    .study-question { display:flex; align-items:flex-start; gap:11px; padding:15px 14px 13px; }
    .question-num { display:grid; place-items:center; flex:none; width:30px;height:30px;border-radius:10px;background:#edf2ff;color:#4866a5;font-size:12px;font-weight:900; }
    .study-question-text { flex:1; min-width:0; font-size:14px; font-weight:800; line-height:1.65; color:#23304e; }
    .study-answer { margin:0 13px 13px; padding:13px 14px; border-radius:13px; background:#f0f5ff; border-right:3px solid #6388d8; animation: enter .2s ease both; }
    .answer-label { display:flex; align-items:center; gap:6px; margin-bottom:5px; font-size:11px; font-weight:900; color:#4067b4; }
    .study-answer p { margin:0; color:#283a61; font-size:13px; line-height:1.8; }
    .source-line { display:flex; align-items:flex-start; gap:6px; margin-top:9px; padding-top:8px; border-top:1px solid rgba(89,122,190,.15); color:#667796; font-size:11px; line-height:1.5; }
    .reveal-btn { width:calc(100% - 28px); min-height:43px; margin:0 14px 13px; border:1px solid #dfe6f4; border-radius:12px; background:#fbfcff; color:#52668f; font-size:12px; font-weight:850; cursor:pointer; }
    .quiz-select-card { position:relative; }
    .quiz-select-card .choice-icon { font-size:23px; }
    .record-line { color:#8b7191 !important; font-weight:750; font-size:10px !important; margin-top:8px; }
    .quiz-shell { max-width:690px; margin:0 auto; }
    .quiz-top { padding:16px; border:1px solid #e4e9f3; border-radius:20px; background:rgba(255,255,255,.9); box-shadow:var(--shadow-small); }
    .quiz-top-line { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:8px; }
    .quiz-name { color:#26375e; font-size:14px; font-weight:900; }
    .quiz-type-badge { padding:6px 10px; border-radius:999px; background:#f0edff; color:#6853b3; font-size:10px; font-weight:900; }
    .progress-info { display:flex; justify-content:space-between; align-items:center; margin-top:15px; color:#6e7890; font-size:11px; font-weight:800; }
    .progress-track { height:8px; margin-top:8px; border-radius:99px; background:#edf0f7; overflow:hidden; }
    .progress-fill { height:100%; width:0; border-radius:99px; background:linear-gradient(90deg,#4b7fdb,#8060cc); transition:width .35s ease; }
    .quiz-question-card { margin-top:15px; padding:21px 17px; border:1px solid #e3e9f4; border-radius:22px; background:rgba(255,255,255,.96); box-shadow:var(--shadow-small); }
    .quiz-question-card h2 { margin:0; font-size:clamp(18px,4.8vw,23px); line-height:1.6; font-weight:900; color:#1e2c4c; letter-spacing:-.25px; }
    .answer-list { display:grid; gap:10px; margin-top:19px; }
    .answer-option { display:flex; align-items:flex-start; gap:11px; width:100%; min-height:57px; padding:13px 13px; text-align:right; color:#34415f; background:#fff; border:1.5px solid #e4e9f2; border-radius:15px; font-size:13px; font-weight:700; line-height:1.6; cursor:pointer; transition:border-color .15s ease,background .15s ease,transform .15s ease; }
    .answer-option:hover:not(:disabled) { border-color:#aebee5; background:#f8faff; }
    .answer-option:disabled { cursor:default; opacity:1; }
    .option-letter { display:grid; place-items:center; flex:none; width:27px;height:27px;border-radius:9px;background:#f0f3fa;color:#697895;font-size:11px;font-weight:900; }
    .answer-option.correct { background:#eaf8ef; border-color:#72c58c; color:#185e34; }
    .answer-option.correct .option-letter { color:#fff; background:#28a45a; }
    .answer-option.wrong { background:#fff0f0; border-color:#e18a8a; color:#8d3030; }
    .answer-option.wrong .option-letter { color:#fff; background:#d95757; }
    .feedback { margin-top:15px; padding:15px; border-radius:16px; background:#f2f6ff; border:1px solid #dfe8fc; animation:enter .2s ease both; }
    .feedback.correct-feedback { background:#eff9f2; border-color:#d5efdd; }
    .feedback.wrong-feedback { background:#fff5f3; border-color:#f5dfd9; }
    .feedback-title { display:flex; align-items:center; gap:7px; color:#256d43; font-size:13px; font-weight:900; }
    .wrong-feedback .feedback-title { color:#a14335; }
    .feedback p { margin:7px 0 0; color:#3d4c68; font-size:12px; line-height:1.75; }
    .feedback .source-line { margin-top:9px; border-color:rgba(90,110,150,.15); }
    .next-wrap { margin-top:14px; }
    .next-wrap .btn { width:100%; }
    .result-card { position:relative; overflow:hidden; padding:25px 18px 21px; text-align:center; border:1px solid rgba(255,255,255,.75); border-radius:27px; background:linear-gradient(150deg,#fff 0%,#f5f6ff 100%); box-shadow:var(--shadow); }
    .result-symbol { display:grid; place-items:center; width:78px;height:78px;margin:0 auto 12px;border-radius:25px;background:linear-gradient(145deg,#fff0c8,#ffe4a2);font-size:36px;box-shadow:0 8px 22px rgba(197,145,51,.18); }
    .result-card h1 { margin:0; color:#1c2b4f; font-size:25px; font-weight:950; letter-spacing:-.7px; }
    .result-sub { margin:6px 0 17px; color:#69758f; font-size:12px; }
    .score-number { color:#4e5fba; font-size:55px; line-height:1.05; font-weight:950; letter-spacing:-2px; }
    .score-number small { font-size:21px; color:#8c96ac; letter-spacing:0; }
    .score-caption { margin-top:5px; color:#69758f; font-size:11px; font-weight:800; }
    .result-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:20px; }
    .stat-box { padding:12px 5px; border-radius:14px; background:#f2f5fb; }
    .stat-box strong { display:block; font-size:20px; color:#27365d; font-weight:950; }
    .stat-box span { display:block; margin-top:3px; color:#78839a; font-size:10px; font-weight:750; }
    .encouragement { margin:17px 0 0; padding:12px; border-radius:14px; color:#605384; background:#f5f1ff; font-size:13px; line-height:1.65; font-weight:800; }
    .result-record { margin-top:11px; color:#8a779c; font-size:10px; font-weight:800; }
    .result-actions { display:grid; grid-template-columns:1fr; gap:9px; margin-top:16px; }
    .result-actions .btn { width:100%; }
    .tiny-note { margin:16px 2px 0; color:#8a94aa; font-size:10px; line-height:1.6; text-align:center; }
    .toast { position:fixed; z-index:50; bottom:calc(18px + var(--safe-bottom)); left:50%; transform:translate(-50%,18px); padding:11px 15px; border-radius:13px; background:#17264b; color:#fff; box-shadow:0 10px 26px rgba(15,25,55,.25); font-size:12px; font-weight:750; opacity:0; pointer-events:none; transition:all .2s ease; max-width:calc(100vw - 30px); text-align:center; }
    .toast.show { opacity:1; transform:translate(-50%,0); }
    .confetti { position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:40; }
    .confetti i { position:absolute; top:-15px; width:7px;height:12px; border-radius:2px; animation:fall 2.5s ease-in forwards; }
    @keyframes fall { to { transform:translate3d(var(--drift),110vh,0) rotate(650deg); opacity:.2; } }
    .footer { margin-top:28px; padding:16px 6px 0; border-top:1px solid rgba(222,229,241,.7); color:#9aa3b7; text-align:center; font-size:10px; line-height:1.7; }
    @media (min-width:620px) {
      main { padding:27px 24px 48px; }
      .topbar { padding-right:24px; padding-left:24px; }
      .hero { padding:34px 36px; min-height:245px; }
      .chapter-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:15px; }
      .chapter-card { min-height:130px; padding:18px; }
      .choice-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .choice-card { min-height:170px; flex-direction:column; }
      .choice-icon { width:58px;height:58px; }
      .result-actions { grid-template-columns:repeat(3,minmax(0,1fr)); }
      .result-actions .btn { padding:0 10px; }
    }
    @media (max-width:360px) {
      main { padding-right:11px; padding-left:11px; }
      .hero { padding:23px 18px 20px; }
      .hero h1 { font-size:34px; }
      .chapter-card { gap:10px; padding:13px; }
      .chapter-icon { width:51px;height:51px;flex-basis:51px; }
      .chapter-copy strong { font-size:15px; }
      .personal-best { left:10px; }
      .quiz-question-card { padding:18px 14px; }
      .answer-option { font-size:12px; padding:12px 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *,*::before,*::after { scroll-behavior:auto !important; animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <header class="topbar">
    <div class="topbar-inner">
      <button class="brand" id="brandHome" type="button" aria-label="חזרה למסך הבית">
        <span class="brand-mark" aria-hidden="true">✦</span>
        <span class="brand-name">לומדים במדבר</span>
      </button>
      <div class="top-actions">
        <button class="top-home" id="homeButton" type="button" hidden>⌂ &nbsp;מסך הבית</button>
      </div>
    </div>
  </header>
  <main id="appMain" aria-live="polite"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="confetti" class="confetti" aria-hidden="true"></div>

  <script>
  'use strict';
  const DB = [{"id":"9","roman":"ט׳","title":"פסח שני","subtitle":"הפסח במדבר ומועדו השני","icon":"🕯️","tone":"blue","questions":[{"n":1,"type":"pshat","q":"באיזה מקום, באיזו שנה ובאיזה חודש ציווה ה׳ את משה על עשיית הפסח?","a":"במדבר סיני, בשנה השנייה לצאת בני ישראל מארץ מצרים, בחודש הראשון.","w":["במדבר פארן, בשנה השנייה לצאת בני ישראל ממצרים, בחודש השני.","בערבות מואב, בשנה הארבעים לצאת בני ישראל ממצרים, בחודש הראשון.","במדבר סיני, בשנה הראשונה לצאת בני ישראל ממצרים, בחודש הראשון."],"source":"במדבר ט׳, א׳","ex":"הציווי נאמר במדבר סיני, בשנה השנייה ליציאת מצרים ובחודש הראשון."},{"n":2,"type":"pshat","q":"באיזה תאריך ובאיזו שעה היה צריך להקריב את קרבן הפסח?","a":"בארבעה עשר בחודש הראשון, בין הערביים.","w":["בארבעה עשר בחודש השני, בין הערביים.","בחמישה עשר בחודש הראשון, בבוקר.","בעשרה בחודש הראשון, בין הערביים."],"source":"במדבר ט׳, ג׳","ex":"מועד הפסח הרגיל הוא בי״ד בחודש הראשון, בין הערביים."},{"n":3,"type":"pshat","q":"מדוע היו אנשים שלא יכלו לעשות את הפסח במועדו?","a":"משום שהיו טמאים לנפש אדם.","w":["משום שהיו בדרך רחוקה ולא יכלו להגיע בזמן.","משום שלא היו להם בהמות ראויות לקרבן.","משום שלא היו נימולים ולא יכלו להשתתף בפסח."],"source":"במדבר ט׳, ו׳","ex":"האנשים שפנו אל משה ואהרן היו טמאים לנפש אדם ולכן לא יכלו לעשות את הפסח במועדו."},{"n":4,"type":"pshat","q":"מה שאלו האנשים הטמאים את משה ואהרן?","a":"״למה נגרע לבלתי הקריב את קרבן ה׳ במועדו בתוך בני ישראל?״","w":["״למה נצא מן המחנה ולא נקריב את קרבן ה׳ עם בני ישראל?״","״למה נמתין עד החודש השני ולא נעשה את הפסח במועדו?״","״למה נגרע לבלתי אכול את קרבן ה׳ עם כל בני ישראל?״"],"source":"במדבר ט׳, ז׳","ex":"הם שאלו מדוע ייגרע חלקם ולא יוכלו להקריב את קרבן ה׳ במועדו בתוך בני ישראל."},{"n":5,"type":"pshat","q":"מתי התקיים הפסח השני, ומה היו צריכים לאכול בו?","a":"בארבעה עשר בחודש השני, בין הערביים, על מצות ומרורים. אסור היה להשאיר ממנו עד הבוקר או לשבור בו עצם.","w":["בחמישה עשר בחודש השני, בבוקר, על מצות ומרורים; מותר היה להשאיר ממנו עד הבוקר.","בארבעה עשר בחודש הראשון, בין הערביים, על מצות ומרורים; חובה היה לשבור את עצמותיו.","בארבעה עשר בחודש השני, בין הערביים, על לחם וביכורים; אסור היה לאכול ממנו בלילה."],"source":"במדבר ט׳, י״א–י״ב","ex":"פסח שני חל בי״ד באייר, בין הערביים. אוכלים אותו על מצות ומרורים, ואין להותיר ממנו עד הבוקר או לשבור בו עצם."},{"n":6,"type":"rashi","q":"מדוע פרשת הפסח מופיעה כאן ולא בתחילת הספר, אף שהאירוע התרחש בחודש הראשון?","a":"משום שאין מוקדם ומאוחר בתורה. הפרשה נכתבה כאן משום שיש בה גנותם של ישראל, שלא הקריבו את הפסח במדבר אלא באותה שנה.","w":["משום שהציווי על הפסח ניתן רק לאחר הקמת המשכן, בחודש השני.","משום שמשה שכח לכתוב את הפרשה בתחילת הספר והיא הושלמה לאחר מכן.","משום שהפרשה עוסקת רק בפסח שני, שנקבע לאחר המסע הראשון."],"source":"רש״י במדבר ט׳, א׳","ex":"רש״י מביא את הכלל ״אין מוקדם ומאוחר בתורה״ ומסביר שהפרשה נכתבה כאן מפני שיש בה גנותם של ישראל: במדבר עשו את הפסח רק באותה שנה."},{"n":7,"type":"rashi","q":"מה לומד רש״י מהמילים ״במועדו״?","a":"שיש להקריב את הפסח במועדו אפילו בשבת ואפילו בטומאה.","w":["שיש להקריב את הפסח רק ביום חול, אך אפשר להקדימו במקרה של טומאה.","שיש להקריב את הפסח בשבת, אך לא כאשר הציבור טמא.","שאפשר לדחות את הפסח למועד אחר כאשר חל בשבת."],"source":"רש״י במדבר ט׳, ב׳","ex":"מן המילה ״במועדו״ רש״י לומד שהפסח קרב במועדו גם כאשר הוא חל בשבת וגם במצב של טומאה."},{"n":8,"type":"rashi","q":"מה ההבדל לפי רש״י בין ״חוקותיו״ לבין ״משפטיו״?","a":"חוקותיו הן המצוות הקשורות לגופו של קרבן הפסח, ומשפטיו הן מצוות הקשורות לפסח ממקומות אחרים בתורה.","w":["חוקותיו הן המצוות שנאמרו בספר שמות, ומשפטיו הן המצוות שנאמרו בספר במדבר.","חוקותיו הן דיני אכילת הפסח, ומשפטיו הם רק דיני הקרבת הדם על המזבח.","חוקותיו הן המצוות שבמחשבה, ומשפטיו הן המצוות הנוגעות למקום הקרבת הפסח."],"source":"רש״י במדבר ט׳, ג׳","ex":"רש״י מבחין בין מצוות שבגופו של קרבן הפסח לבין מצוות הנוגעות לפסח שנלמדות ממקומות אחרים בתורה."},{"n":9,"type":"rashi","q":"מדוע נאמר שהאנשים הטמאים באו ״לפני משה ולפני אהרן״?","a":"משום שמשה ואהרן ישבו יחד בבית המדרש. רש״י מסביר שלא ייתכן ששאלו את משה ואחר כך את אהרן, שהרי אם משה לא ידע את התשובה, כיצד אהרן ידע?","w":["משום שמשה היה המנהיג ואהרן היה הכוהן הגדול, ולכן פנו אליהם לפי סדר חשיבותם.","משום שמשה שמע את השאלה תחילה, ולאחר מכן ביקש מהאנשים להציג אותה גם לאהרן.","משום שאהרן ידע את התשובה ומשה ביקש ממנו ללמד אותה את האנשים."],"source":"רש״י במדבר ט׳, ו׳","ex":"רש״י מסביר שמשה ואהרן ישבו יחד בבית המדרש. לכן אין הכוונה שהאנשים שאלו את משה ורק אחר כך את אהרן."},{"n":10,"type":"rashi","q":"מהי ״דרך רחוקה״ לפי רש״י?","a":"שהיה חוץ לאסקופת העזרה כל זמן שחיטה פסח שני","w":["מחוץ לגבולות מחנה ישראל, בכל מרחק שהוא.","מן ירושלים ולחוץ, וכמידתה לכל רוח.","ממרחק של יום הליכה ממקום הקרבת הפסח."],"source":"רש״י במדבר ט׳, י׳","ex":"רש״י מגדיר את הדרך הרחוקהשהיה חוץ לאסקופת העזרה כל זמן שחיטה פסח שני , ובאותה מידה לכל כיוון."}]},{"id":"10","roman":"י׳","title":"החצוצרות ומסעות בני ישראל","subtitle":"קול החצוצרות וסדר המסע","icon":"📯","tone":"purple","questions":[{"n":11,"type":"pshat","q":"כמה חצוצרות נצטווה משה להכין, מאיזה חומר הן היו עשויות ומה הייתה מטרתן?","a":"שתי חצוצרות כסף עשויות מקשה אחת, כדי לקרוא לעדה ולסמן למחנות לצאת למסע.","w":["שתי חצוצרות זהב עשויות מקשה אחת, כדי להכריז על מועדים בלבד.","חצוצרה אחת מכסף, כדי לקרוא לנשיאים ולהודיע על מלחמה.","ארבע חצוצרות כסף נפרדות, כדי לסמן לכל שבט את מקומו במסע."],"source":"במדבר י׳, ב׳","ex":"הציווי הוא להכין שתי חצוצרות כסף מקשה אחת, לצורך מקרא העדה ולמסע המחנות."},{"n":12,"type":"pshat","q":"מה היה צריך לעשות כדי לכנס את כל העדה, ומה היה צריך לעשות כדי לכנס רק את הנשיאים?","a":"כדי לכנס את כל העדה תוקעים בשתי החצוצרות, וכדי לכנס את הנשיאים תוקעים בחצוצרה אחת.","w":["לכל העדה תוקעים בחצוצרה אחת, ולנשיאים בשתי החצוצרות.","לכל העדה תוקעים שלוש פעמים בשתי החצוצרות, ולנשיאים מריעים בחצוצרה אחת.","לכל העדה מריעים בחצוצרה אחת, ולנשיאים תוקעים בשתיהן לסירוגין."],"source":"במדבר י׳, ג׳–ד׳","ex":"הקהל כולו נקרא באמצעות תקיעה בשתי החצוצרות; הנשיאים נקראים בתקיעה באחת."},{"n":13,"type":"pshat","q":"איזה מחנה נסע ראשון ואיזה מחנה נסע אחריו?","a":"תחילה דגל מחנה יהודה, ואחריו דגל מחנה ראובן.","w":["תחילה דגל מחנה ראובן, ואחריו דגל מחנה יהודה.","תחילה דגל מחנה אפרים, ואחריו דגל מחנה דן.","תחילה דגל מחנה דן, ואחריו דגל מחנה יהודה."],"source":"במדבר י׳, י״ד–י״ח","ex":"בסדר המסעות המתואר בפסוקים, דגל מחנה יהודה יוצא ראשון ואחריו דגל מחנה ראובן."},{"n":14,"type":"pshat","q":"מי היו צריכים לתקוע בחצוצרות ובאילו אירועים נוספים השתמשו בהן?","a":"בני אהרן הכוהנים. השתמשו בהן גם בעת מלחמה, בימי שמחה, במועדים ובראשי חודשים, על העולות ועל זבחי השלמים.","w":["הלויים. השתמשו בהן רק בעת מסעות ובכינוס כל העם.","נשיאי השבטים. השתמשו בהן במלחמה, בראשי חודשים ובימי צום בלבד.","בני אהרן הכוהנים. השתמשו בהן רק במלחמה וביציאה למסע, ולא בקרבנות."],"source":"במדבר י׳, ח׳–י׳","ex":"בני אהרן הכוהנים תוקעים בחצוצרות. הפסוקים מוסיפים שימושים בעת צרה ומלחמה, בשמחה, במועדים ובראשי חודשים, על הקרבנות."},{"n":15,"type":"pshat","q":"באיזה תאריך בשנה השנייה יצאו בני ישראל למסע ממדבר סיני?","a":"בעשרים בחודש השני, בשנה השנייה לצאתם מארץ מצרים.","w":["בעשרים בחודש הראשון, בשנה השנייה לצאתם מארץ מצרים.","באחד בחודש השני, בשנה השנייה לצאתם מארץ מצרים.","בעשרים בחודש השני, בשנה הראשונה לצאתם מארץ מצרים."],"source":"במדבר י׳, י״א–י״ב","ex":"המסע ממדבר סיני החל בעשרים בחודש השני, בשנה השנייה ליציאת מצרים."},{"n":16,"type":"rashi","q":"מה מסביר רש״י על הציווי ״עשה לך״ בנוגע לחצוצרות?","a":"החצוצרות נועדו לכבודו של משה, היו צריכות להיעשות משלו, והוא היה המשתמש בהן ולא אדם אחר.","w":["החצוצרות נועדו לכל נשיא, וכל נשיא היה צריך להכין לעצמו חצוצרה משלו.","החצוצרות נועדו לעבודת הכוהנים בלבד, ומשה היה צריך למסור אותן לאהרן.","הציווי מלמד שהחצוצרות ייעשו מכספי הציבור וישמשו כל אדם במחנה."],"source":"רש״י במדבר י׳, ב׳","ex":"רש״י דורש את ״עשה לך״ לכבודו של משה: החצוצרות היו משלו, והוא לבדו השתמש בהן."},{"n":17,"type":"rashi","q":"כמה זמן שהו בני ישראל בחורב לפי רש״י?","a":"שנים עשר חודשים פחות עשרה ימים.","w":["שנים עשר חודשים שלמים.","אחד עשר חודשים ועשרה ימים.","שלושה עשר חודשים פחות עשרה ימים."],"source":"רש״י במדבר י׳, י״א","ex":"לפי רש״י, בני ישראל שהו בחורב שנים עשר חודשים חסרים עשרה ימים."},{"n":18,"type":"rashi","q":"מדוע נקרא שבט דן ״מאסף לכל המחנות״ לפי רש״י?","a":"משום שהיה נוסע אחרון ואוסף את החפצים שאנשים איבדו בדרך ומחזיר אותם לבעליהם.","w":["משום שהיה נוסע ראשון ומכין את הדרך למחנות הבאים אחריו.","משום שהיה אוסף את כל הבהמות והצאן של המחנות לפני היציאה.","משום שהיה שומר על ארון הברית והולך מאחורי המשכן."],"source":"רש״י במדבר י׳, כ״ה","ex":"שבט דן נסע מאחור ואסף חפצים שאבדו בדרך, כדי להשיבם לבעליהם."},{"n":19,"type":"rashi","q":"מדוע מופיעות נו״נים הפוכות לפני ואחרי פרשת ״ויהי בנסוע הארון״?","a":"כדי ללמד שאין זה מקומה המקורי של הפרשה, והיא נכתבה כאן כדי להפסיק בין פורענות לפורענות.","w":["כדי להדגיש שהארון נסע לפני כל המחנות ולשמור על סדר המסע.","כדי לסמן שהפסוקים נאמרו בנבואה מיוחדת ולא נכתבו בידי משה.","כדי לציין שהפרשה שייכת לחג השבועות ונאמרה בזמן אחר."],"source":"רש״י במדבר י׳, ל״ה","ex":"רש״י מסביר שהנו״נים ההפוכות מציינות שהפרשה אינה במקומה, והיא הוכנסה כאן כדי להפסיק בין שתי פורענויות."},{"n":20,"type":"rashi","q":"מיהו חובב ומה מסביר רש״י על שמו?","a":"חובב הוא יתרו, חותן משה. הוא נקרא חובב על שם שחיבב את התורה.","w":["חובב הוא יהושע בן נון, שנקרא כך מפני שחיבב את ארץ ישראל.","חובב הוא אלעזר בן אהרן, שנקרא כך מפני שחיבב את עבודת המשכן.","חובב הוא בנו של יתרו, שנקרא כך מפני שחיבב את משה."],"source":"רש״י במדבר י׳, כ״ט","ex":"רש״י מזהה את חובב עם יתרו, חותן משה, ומסביר שנקרא כך מפני שחיבב את התורה."}]},{"id":"11","roman":"י״א","title":"המתאוננים והזקנים","subtitle":"התלונות, המן ושבעים הזקנים","icon":"🔥","tone":"gold","questions":[{"n":21,"type":"pshat","q":"מה קרה כאשר העם היה כמתאוננים, ובאיזה שם נקרא המקום?","a":"אש ה׳ בערה בעם ואכלה בקצה המחנה. לאחר שמשה התפלל האש שקעה, והמקום נקרא תבערה.","w":["רוח חזקה פיזרה את המחנה, ולאחר תפילת משה נקרא המקום מסעי.","אש ה׳ בערה במשכן וכילתה את הקרבנות, והמקום נקרא סיני.","מגפה פגעה באמצע המחנה, ומשה קרא למקום קברות התאווה."],"source":"במדבר י״א, א׳–ג׳","ex":"אש ה׳ בערה בקצה המחנה. משה התפלל, האש שקעה, ושם המקום נקרא תבערה."},{"n":22,"type":"pshat","q":"אילו מאכלים הזכירו בני ישראל שאכלו במצרים?","a":"דגים, קישואים, אבטיחים, חציר, בצלים ושומים.","w":["דגים, מלונים, ענבים, חציר, בצלים ושומים.","בשר, קישואים, אבטיחים, עדשים, בצלים ושומים.","דגים, קישואים, אבטיחים, חציר, כרובים ותמרים."],"source":"במדבר י״א, ה׳","ex":"העם הזכיר את הדגים, הקישואים, האבטיחים, החציר, הבצלים והשומים שאכל במצרים."},{"n":23,"type":"pshat","q":"כיצד מתארת התורה את המן וכיצד היו מכינים אותו?","a":"המן היה כזרע גד ומראהו כעין הבדולח. היו טוחנים אותו בריחיים או דוכים במדוכה, מבשלים בפרור ועושים ממנו עוגות.","w":["המן היה כגרגרי חיטה ומראהו לבן כשלג. היו אופים אותו בתנור ואוכלים אותו ככיכר לחם.","המן היה כזרע חרדל ומראהו כעין הזהב. היו קולים אותו באש וטוחנים אותו לאחר הבישול.","המן היה כזרע גד ומראהו כעין הבדולח. היו שורים אותו במים, אופים אותו על מחבת ומכינים ממנו מצות."],"source":"במדבר י״א, ז׳–ח׳","ex":"המן מתואר כזרע גד וכמראה הבדולח. העם טחן או דך אותו, בישל בפרור והכין ממנו עוגות."},{"n":24,"type":"pshat","q":"כמה זקנים נצטווה משה לאסוף והיכן היו צריכים להתייצב?","a":"שבעים איש מזקני ישראל, באוהל מועד עם משה.","w":["שבעים ושניים איש מזקני ישראל, בפתח המשכן עם אהרן.","שנים עשר איש מנשיאי ישראל, סביב אוהל מועד.","שבעים איש מזקני ישראל, בפתח אוהלו של משה במחנה."],"source":"במדבר י״א, ט״ז","ex":"משה נצטווה לאסוף שבעים מזקני ישראל, והם התייצבו באוהל מועד עם משה."},{"n":25,"type":"pshat","q":"מה קרה לאלדד ומידד ומה ביקש יהושע ממשה לעשות?","a":"רוח ה׳ נחה עליהם והם התנבאו במחנה. יהושע ביקש ממשה לכלוא אותם, ומשה השיב: ״המקנא אתה לי? ומי יתן כל עם ה׳ נביאים״.","w":["הם סירבו לבוא לאוהל מועד ולא קיבלו את רוח ה׳. יהושע ביקש להעניש אותם ומשה הסכים.","הם התנבאו באוהל מועד לצד שבעים הזקנים. יהושע ביקש למנות אותם לנשיאים.","הם יצאו מן המחנה בזמן הנבואה. יהושע ביקש להחזיר אותם ומשה ציווה להרחיקם."],"source":"במדבר י״א, כ״ו–כ״ט","ex":"רוח ה׳ נחה על אלדד ומידד והם התנבאו במחנה. יהושע ביקש לכלוא אותם, ומשה השיב שאינו מקנא לו והביע משאלה שכל עם ה׳ יהיו נביאים."},{"n":26,"type":"rashi","q":"מה פירוש המילה ״מתאוננים״ לפי רש״י?","a":"לשון עלילה. בני ישראל ביקשו למצוא תירוץ כדי לפרוש מאחרי המקום.","w":["לשון רעב. בני ישראל ביקשו למצוא מזון במקום שבו חנו.","לשון תפילה. בני ישראל ביקשו שמשה יתפלל בעדם.","לשון מסע. בני ישראל ביקשו להקדים את יציאתם לדרך."],"source":"רש״י במדבר י״א, א׳","ex":"רש״י מפרש ״מתאוננים״ כלשון עלילה: הם חיפשו תואנה לפרוש מאחרי ה׳."},{"n":27,"type":"rashi","q":"מי הם האנשים שנקראו ״בקצה המחנה״ לפי רש״י?","a":"לפי פירוש אחד, השפלים שבמחנה, כלומר הערב רב. רבי שמעון בן מנסיא מפרש שמדובר בקצינים ובגדולים שבעם.","w":["לפי כל הפירושים, מדובר באנשים שהלכו בראש המחנה והובילו את המסע.","לפי פירוש אחד, הזקנים שבמחנה. רבי שמעון בן מנסיא מפרש שמדובר בילדים ובטף.","לפי פירוש אחד, שבט דן. רבי שמעון בן מנסיא מפרש שמדובר בכוהנים בלבד."],"source":"רש״י במדבר י״א, א׳","ex":"רש״י מביא שני פירושים: השפלים שבמחנה, המזוהים עם הערב רב, או הקצינים והגדולים שבעם לפי רבי שמעון בן מנסיא."},{"n":28,"type":"rashi","q":"מי היה האספסוף לפי רש״י?","a":"הערב רב שהתקבצו עם בני ישראל ביציאתם ממצרים.","w":["שבעים הזקנים שנאספו באוהל מועד.","האנשים הטמאים שביקשו לעשות את הפסח השני.","שבט דן שהלך מאסף לכל המחנות במדבר."],"source":"רש״י במדבר י״א, ד׳","ex":"רש״י מזהה את האספסוף עם הערב רב שהצטרפו לבני ישראל ביציאת מצרים."},{"n":29,"type":"rashi","q":"מה פירוש המילה ״חינם״ במילים ״אשר נאכל במצרים חינם״ לפי רש״י?","a":"בני ישראל התכוונו שאכלו במצרים חינם מן המצוות, כלומר ללא עול המצוות.","w":["שהמצרים נתנו להם את המזון ללא תשלום כספי.","שהם יכלו לאכול במצרים בלי לעבוד עבור המצרים.","שהמזון במצרים היה מצוי בשפע ולא היה צורך לקנותו."],"source":"רש״י במדבר י״א, ה׳","ex":"רש״י מפרש ״חינם״ לא כמתנה של אוכל, אלא כחינם מן המצוות — ללא עול המצוות."},{"n":30,"type":"rashi","q":"כיצד מפרש רש״י את הביטוי ״בוכה למשפחותיו״?","a":"המשפחות היו נאספות ובוכות כדי לפרסם את תלונתן, ולפי פירוש חז״ל בכו על ענייני משפחות ועריות שנאסרו להם.","w":["כל משפחה בכתה בנפרד מפני שאיבדה את מקומה בסדר המחנות.","המשפחות התאספו כדי לבקש מזון נוסף, ולא התייחסו לענייני איסור והיתר.","העם בכה על חלוקת התפקידים בין השבטים ועל מינוי שבעים הזקנים."],"source":"רש״י במדבר י״א, י׳","ex":"רש״י מביא את הבכי של המשפחות לשם פרסום התלונה, ואת פירוש חז״ל שבכו על איסורי משפחות ועריות."}]},{"id":"12","roman":"י״ב","title":"מרים ואהרן מדברים במשה","subtitle":"דברי מרים ואהרן ותשובת ה׳","icon":"☁️","tone":"teal","questions":[{"n":31,"type":"pshat","q":"על מי דיברו מרים ואהרן ובאיזה עניין?","a":"על משה, בעניין האישה הכושית אשר לקח, ואמרו: ״הרק אך במשה דיבר ה׳ הלא גם בנו דיבר״.","w":["על יהושע, בעניין מינויו למנהיג, ואמרו שה׳ דיבר גם אליהם.","על משה, בעניין חלוקת התפקידים במשכן, וטענו שרק אהרן רשאי לדבר עם ה׳.","על אלעזר, בעניין הכהונה, ושאלו מדוע ה׳ דיבר רק עם משה ואהרן."],"source":"במדבר י״ב, א׳–ב׳","ex":"מרים ואהרן דיברו על משה בקשר לאישה הכושית אשר לקח, והעלו את הטענה שה׳ דיבר גם בהם."},{"n":32,"type":"pshat","q":"כיצד מתארת התורה את משה בפסוק ג׳?","a":"עניו מאוד, יותר מכל האדם אשר על פני האדמה.","w":["חכם מאוד, יותר מכל חכמי ישראל אשר במחנה.","גיבור מאוד, יותר מכל אנשי המלחמה אשר במדבר.","זקן מאוד, יותר מכל מנהיגי ישראל אשר יצאו ממצרים."],"source":"במדבר י״ב, ג׳","ex":"התורה מתארת את משה כעניו מאוד, יותר מכל האדם שעל פני האדמה."},{"n":33,"type":"pshat","q":"כיצד התגלה ה׳ אל משה, אהרן ומרים ומה אמר להם לעשות?","a":"ה׳ קרא להם לצאת שלושתם אל אוהל מועד, ירד בעמוד ענן ועמד בפתח האוהל, וקרא לאהרן ולמרים לצאת.","w":["ה׳ קרא להם לעלות להר סיני, התגלה באש ודיבר אל שלושתם מתוך ההר.","ה׳ קרא למשה לבדו לאוהל מועד, ירד בענן ודיבר אליו על אהרן ומרים.","ה׳ קרא לאהרן ולמרים לצאת מן המחנה, ועמד בעמוד אש מול המשכן."],"source":"במדבר י״ב, ד׳–ה׳","ex":"ה׳ קרא לשלושתם אל אוהל מועד, ירד בעמוד ענן, עמד בפתח האוהל וקרא לאהרן ולמרים."},{"n":34,"type":"pshat","q":"מה ההבדל שה׳ מציג בין נבואת שאר הנביאים לנבואת משה?","a":"שאר הנביאים מקבלים נבואה במראה ובחלום, ואילו עם משה ה׳ מדבר פה אל פה, במראה ולא בחידות.","w":["שאר הנביאים מקבלים נבואה פה אל פה, ואילו משה מקבל אותה רק בחלום ובמשל.","שאר הנביאים מקבלים נבואה באמצעות מלאך, ואילו משה מקבל אותה רק באמצעות עמוד הענן.","שאר הנביאים מקבלים נבואה בחידות בלבד, ואילו משה מקבל אותה באמצעות חלומות."],"source":"במדבר י״ב, ו׳–ח׳","ex":"ה׳ מתאר את נבואת הנביאים במראה ובחלום, ולעומת זאת מדבר עם משה פה אל פה, במראה ולא בחידות."},{"n":35,"type":"pshat","q":"מה קרה למרים, כמה זמן נשארה מחוץ למחנה ומה עשו בני ישראל בזמן הזה?","a":"מרים נעשתה מצורעת כשלג והוסגרה מחוץ למחנה שבעה ימים. בני ישראל לא נסעו עד שנאספה מרים.","w":["מרים נעשתה מצורעת כשלג והוסגרה מחוץ למחנה ארבעה עשר ימים. המחנה המשיך במסע.","מרים נעשתה חולה ונשארה באוהל שבעה ימים. אהרן הוביל את העם במסע.","מרים נעשתה מצורעת כשלג והוסגרה מחוץ למחנה שבעה ימים. העם יצא לדרך מיד לאחר מכן."],"source":"במדבר י״ב, י׳–ט״ז","ex":"מרים לקתה בצרעת כשלג, הוסגרה מחוץ למחנה שבעה ימים, והעם לא נסע עד שנאספה."},{"n":36,"type":"rashi","q":"מדוע הוזכרה מרים לפני אהרן וכיצד ידעה מרים שמשה פרש מאשתו?","a":"מרים פתחה בדיבור ולכן הוקדמה. היא ידעה מכך ששמעה את צפורה מדברת על כך כאשר שמעה שאלדד ומידד מתנבאים במחנה.","w":["מרים הוזכרה ראשונה מפני שהייתה המבוגרת במשפחה. היא ידעה זאת מפני שמשה סיפר לה במפורש.","אהרן פתח בדיבור אך מרים הוקדמה מפני שהייתה נביאה. היא ידעה זאת לאחר ששמעה את משה מתפלל.","מרים הוזכרה ראשונה מפני שהייתה אחותו של משה. היא ידעה זאת משיחה עם יהושע באוהל מועד."],"source":"רש״י במדבר י״ב, א׳","ex":"רש״י מסביר שמרים הוקדמה מפני שהיא פתחה בדיבור. היא שמעה מציפורה על פרישת משה כאשר דיברו על נבואת אלדד ומידד במחנה."},{"n":37,"type":"rashi","q":"מדוע נקראת אשת משה ״האישה הכושית״ לפי רש״י?","a":"הכינוי מלמד על יופייה המיוחד, שכולם הודו בו, בדומה לכך שכולם מודים בשחרותו של אדם כושי.","w":["מפני שמוצאה היה מארץ כוש, והכתוב מבקש לציין את מקום הולדתה.","מפני שהייתה לבושה בבגדים כהים כמנהג נשות כוש.","מפני שהייתה בעלת תפקיד בשבט כוש, ולא מפני יופייה."],"source":"רש״י במדבר י״ב, א׳","ex":"רש״י דורש את הכינוי על יופייה: כשם שאין מחלוקת על שחרותו של אדם כושי, כך הכול הודו ביופייה."},{"n":38,"type":"rashi","q":"מה פירוש המילה ״ענו״ לפי רש״י?","a":"שפל וסבלן.","w":["חכם ובקי בדברי תורה.","עני וחסר רכוש.","שקט ואינו מרבה לדבר."],"source":"רש״י במדבר י״ב, ג׳","ex":"רש״י מפרש ״ענו״ במובן של שפל וסבלן."},{"n":39,"type":"rashi","q":"מדוע התגלה ה׳ פתאום אל שלושת האחים ומה רצה ללמד אותם לפי רש״י?","a":"כדי להראות למרים ולאהרן שמשה צדק בכך שפרש מאשתו, משום שהנבואה אליו יכולה להגיע בכל עת ואין לה זמן קבוע.","w":["כדי להעניש את מרים ואהרן מיד, לפני שיוכלו לבקש סליחה על דבריהם.","כדי ללמד שכל הנביאים חייבים לפרוש ממשפחותיהם בכל ימות השנה.","כדי להודיע למשה שעליו להפסיק את תפקידו כמנהיג ולמסור אותו לאהרן."],"source":"רש״י במדבר י״ב, ד׳","ex":"ההתגלות הפתאומית מלמדת שהנבואה למשה עשויה להגיע בכל עת, ולכן פרישתו מאשתו הייתה מוצדקת."},{"n":40,"type":"rashi","q":"מה ההבדל לפי רש״י בין נבואת משה לנבואת שאר הנביאים ומה פירוש ״ותמונת ה׳ יביט״?","a":"שאר הנביאים מקבלים נבואה בחלום ובחזון, ואילו עם משה ה׳ מדבר פה אל פה. ״ותמונת ה׳ יביט״ מתייחס לראיית אחוריים, כפי שנאמר למשה ״וראית את אחורי״.","w":["שאר הנביאים מקבלים נבואה פה אל פה, ומשה רואה את פני ה׳; הביטוי מתאר ראייה מלאה.","שאר הנביאים מקבלים נבואה בחידות בלבד, ומשה שומע אותה דרך מלאך; הביטוי מתייחס לעמוד הענן.","שאר הנביאים מקבלים נבואה בחלום, ומשה מקבל אותה בחזון; הביטוי מתייחס ללוחות הברית."],"source":"רש״י במדבר י״ב, ו׳–ח׳","ex":"רש״י מבדיל בין חלום וחזון אצל שאר הנביאים לבין דיבור פה אל פה עם משה. ״ותמונת ה׳ יביט״ נדרש על ראיית האחוריים, ככתוב ״וראית את אחורי״."}]}];
  const $ = (selector, root=document) => root.querySelector(selector);
  const $$ = (selector, root=document) => Array.from(root.querySelectorAll(selector));

  const LETTERS = ['א','ב','ג','ד'];
  let stats = loadStats();

  function loadStats() {
    try {
      const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      return parsed && typeof parsed === 'object' ? parsed : {};
    } catch (_) { return {}; }
  }
  function saveStats() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(stats)); }
    catch (_) { showToast('לא ניתן לשמור נתונים בדפדפן זה. החידון עדיין פועל כרגיל.'); }
  }
  function keyFor(chapterId,type) { return `${chapterId}-${type}`; }

  function bestForChapter(chapterId) {
    const values = ['pshat','rashi'].map(t => getRecord(chapterId,t)?.bestScore).filter(v => Number.isFinite(v));
    return values.length ? Math.max(...values) : null;
  }
  function shuffle(items) {
    const a = items.slice();
    for (let i=a.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
    return a;
  }
  function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  }
  function showToast(message) {
    const el=$('#toast'); el.textContent=message; el.classList.add('show');

  }
  function setScreen(name) {

    homeButton.hidden = name==='home';

        <span class="chapter-arrow" aria-hidden="true">‹</span>
      </button>`;

    main.innerHTML=`<section class="screen">

    $$('[data-chapter]',main).forEach(btn=>btn.addEventListener('click',()=>openChapter(btn.dataset.chapter)));

  function renderActivity() {

      </div>
      <div class="btn-row"><button class="btn btn-secondary" type="button" id="backHome">⌂ &nbsp;חזרה לבחירת הפרקים</button></div>
      <div class="tiny-note">${pbest!==undefined||rbest!==undefined?`השיאים בפרק זה: פשט ${pbest??'—'}/100 · רש״י ${rbest??'—'}/100`:'השיא האישי יוצג כאן לאחר השלמת חידון.'}</div>
    </section>`;
    $('#studyChoice').addEventListener('click',renderStudy);
    $('#quizChoice').addEventListener('click',renderQuizModes);
    $('#backHome').addEventListener('click',renderHome);
  }
  function renderStudy() {
    const c=getChapter(); if(!c) return renderHome();
    setScreen('study');
    const p=c.questions.filter(q=>q.type==='pshat');
    const r=c.questions.filter(q=>q.type==='rashi');
    const group=(items,title,icon)=>`<section class="study-group"><h2 class="group-title"><span>${icon}</span>${title}</h2>${items.map(q=>`<article class="study-card" data-study-card="${q.n}"><div class="study-question"><span class="question-num">${q.n}</span><div class="study-question-text">${escapeHTML(q.q)}</div></div><div class="study-answer" id="answer-${q.n}" hidden><div class="answer-label">✓ תשובה מלאה</div><p>${escapeHTML(q.a)}</p><div class="source-line"><span>📍</span><span>מראה מקום: ${escapeHTML(q.source)}</span></div></div><button class="reveal-btn" type="button" data-reveal="${q.n}" aria-expanded="false" aria-controls="answer-${q.n}">הצג תשובה ＋</button></article>`).join('')}</section>`;
    main.innerHTML=`<section class="screen">${chapterBanner(c)}
      <div class="page-heading"><span class="kicker">שלב 2 · לימוד הפרק</span><h1>שאלות ותשובות</h1><p>נסו לענות בעצמכם, ואז לחצו על ״הצג תשובה״ כדי לבדוק את עצמכם.</p></div>
      ${group(p,'שאלות על פסוקי התורה','📜')}${group(r,'שאלות על פירוש רש״י','✍️')}
      <div class="btn-row"><button class="btn btn-secondary" type="button" id="backActivity">← &nbsp;בחירת פעילות</button><button class="btn btn-primary" type="button" id="toQuizModes">מעבר לחידון &nbsp;✦</button></div>
      <div class="footer">כל אחת מעשר השאלות כוללת תשובה ומראה מקום. אפשר לפתוח ולסגור את התשובות לפי הצורך.</div>
    </section>`;
    $$('[data-reveal]',main).forEach(btn=>btn.addEventListener('click',()=>{
      const id=btn.dataset.reveal, answer=$(`#answer-${id}`), open=answer.hidden;
      answer.hidden=!open; btn.setAttribute('aria-expanded',String(open)); btn.textContent=open?'הסתר תשובה −':'הצג תשובה ＋';
    }));
    $('#backActivity').addEventListener('click',renderActivity);
    $('#toQuizModes').addEventListener('click',renderQuizModes);
  }
  function renderQuizModes() {
    const c=getChapter(); if(!c) return renderHome();
    setScreen('quizModes');
    const modeCard=(type,title,desc,icon,tint,accent)=>{
      const rec=getRecord(c.id,type), best=rec?.bestScore, last=rec?.lastScore;
      return `<button class="choice-card quiz-select-card" type="button" data-quiz-type="${type}" style="--choice-tint:${tint};--choice-accent:${accent}"><span class="choice-icon" aria-hidden="true">${icon}</span><span class="choice-text"><strong>${title}</strong><span>${desc}</span><span class="choice-meta"><span class="mini-tag">5 שאלות</span><span class="mini-tag">4 אפשרויות לכל שאלה</span></span>${rec?`<span class="record-line">שיא אישי: ${best}/100 · ניסיון אחרון: ${last}/100</span>`:`<span class="record-line">עדיין אין ניסיון קודם</span>`}</span></button>`;
    };
    main.innerHTML=`<section class="screen">${chapterBanner(c)}
      <div class="page-heading"><span class="kicker">שלב 3 · בחירת חידון</span><h1>באיזה סוג חידון נתחיל?</h1><p>כל חידון כולל חמש שאלות, הסבר לאחר כל תשובה ומראה מקום מדויק.</p></div>
      <div class="choice-grid">${modeCard('pshat','חידון על הפשט','חמש שאלות המבוססות ישירות על פסוקי התורה.','📜','#eaf1ff','#4778d7')}${modeCard('rashi','חידון על רש״י','חמש שאלות על פירוש רש״י וההסברים שבפרק.','✍️','#f0edff','#7860ce')}</div>
      <div class="btn-row"><button class="btn btn-secondary" type="button" id="backActivity">← &nbsp;חזרה לבחירת הפעילות</button></div>
    </section>`;
    $$('[data-quiz-type]',main).forEach(btn=>btn.addEventListener('click',()=>startQuiz(btn.dataset.quizType)));
    $('#backActivity').addEventListener('click',renderActivity);
  }
  function startQuiz(type) {
    const c=getChapter(); if(!c) return renderHome();
    state.quizType=type;
    state.quizQuestions=shuffle(c.questions.filter(q=>q.type===type)).map(q=>({ ...q, options:shuffle([q.a,...q.w]) }));
    state.questionIndex=0; state.answered=false; state.selected=null; state.correctCount=0; state.lastScore=null;
    renderQuiz();
  }
  function renderQuiz() {
    const c=getChapter(); if(!c || state.quizQuestions.length!==5) return renderQuizModes();
    setScreen('quiz');
    const q=state.quizQuestions[state.questionIndex];
    const current=state.questionIndex+1;
    const pct=(current/5)*100;
    const typeName=state.quizType==='pshat'?'פשט':'רש״י';
    const options=q.options.map((option,i)=>{
      let cls='';
      if(state.answered && option===q.a) cls='correct';
      if(state.answered && i===state.selected && option!==q.a) cls='wrong';
      return `<button class="answer-option ${cls}" type="button" data-option="${i}" ${state.answered?'disabled':''}><span class="option-letter">${LETTERS[i]}</span><span>${escapeHTML(option)}</span></button>`;
    }).join('');
    const feedback=state.answered?`<div class="feedback ${state.selected!==null && q.options[state.selected]===q.a?'correct-feedback':'wrong-feedback'}"><div class="feedback-title">${q.options[state.selected]===q.a?'✓ תשובה נכונה!':'✕ לא מדויק — זו ההזדמנות ללמוד'}</div><p>${escapeHTML(q.ex)}</p><div class="source-line"><span>📍</span><span>מראה מקום: ${escapeHTML(q.source)}</span></div></div>`:'';
    main.innerHTML=`<section class="screen quiz-shell">
      <div class="quiz-top"><div class="quiz-top-line"><span class="quiz-name">פרק ${c.roman} · ${escapeHTML(c.title)}</span><span class="quiz-type-badge">חידון ${typeName}</span></div><div class="progress-info"><span>שאלה ${current} מתוך 5</span><span>${Math.round(pct)}% הושלמו</span></div><div class="progress-track" role="progressbar" aria-label="התקדמות החידון" aria-valuemin="0" aria-valuemax="5" aria-valuenow="${current}"><div class="progress-fill" style="width:${pct}%"></div></div></div>
      <div class="quiz-question-card"><h2>${escapeHTML(q.q)}</h2><div class="answer-list">${options}</div>${feedback}${state.answered?`<div class="next-wrap"><button class="btn btn-primary" type="button" id="nextQuestion">${current===5?'לצפייה בתוצאות':'לשאלה הבאה'} &nbsp;←</button></div>`:''}</div>
      <div class="tiny-note">בחרו תשובה אחת בלבד. התשובה הנכונה וההסבר יוצגו לאחר הבחירה.</div>
    </section>`;
    $$('[data-option]',main).forEach(btn=>btn.addEventListener('click',()=>chooseAnswer(Number(btn.dataset.option))));
    const next=$('#nextQuestion'); if(next) next.addEventListener('click',advanceQuestion);
  }
  function chooseAnswer(index) {
    if(state.answered || !Number.isInteger(index) || index<0 || index>3) return;
    const q=state.quizQuestions[state.questionIndex];
    if(!q || !q.options[index]) return;
    state.answered=true; state.selected=index;
    if(q.options[index]===q.a) state.correctCount++;
    renderQuiz();
  }
  function advanceQuestion() {
    if(!state.answered) return;
    if(state.questionIndex<4) { state.questionIndex++; state.answered=false; state.selected=null; renderQuiz(); }
    else finishQuiz();
  }
  function finishQuiz() {
    const c=getChapter();
    const score=state.correctCount*20;
    state.lastScore=score;
    const key=keyFor(c.id,state.quizType), previous=stats[key]||{bestScore:0,attempts:0,lastScore:0};
    stats[key]={bestScore:Math.max(previous.bestScore||0,score),lastScore:score,attempts:(previous.attempts||0)+1,lastPlayed:new Date().toISOString()};
    saveStats();
    renderResult();
  }
  function encouragement(score) {
    if(score===100) return 'מושלם! שליטה מצוינת בחומר!';
    if(score>=80) return 'מצוין! אתם מכירים היטב את הפרק!';
    if(score>=60) return 'כל הכבוד! עוד קצת תרגול ותצליחו אפילו יותר!';
    return 'לא נורא! זו הזדמנות מצוינת ללמוד ולהשתפר.';
  }
  function renderResult() {
    const c=getChapter(); if(!c) return renderHome();
    setScreen('result');
    const score=state.lastScore ?? state.correctCount*20;
    const wrong=5-state.correctCount;
    const typeName=state.quizType==='pshat'?'פשט':'רש״י';
    const rec=getRecord(c.id,state.quizType);
    const perfect=score===100;
    main.innerHTML=`<section class="screen quiz-shell"><div class="result-card"><div class="result-symbol" aria-hidden="true">${perfect?'🏆':'📚'}</div><h1>כל הכבוד! סיימתם את החידון!</h1><p class="result-sub">פרק ${c.roman} · חידון ${typeName}</p><div class="score-number">${score}<small> / 100</small></div><div class="score-caption">הציון שלכם</div><div class="result-stats"><div class="stat-box"><strong>${state.correctCount}</strong><span>תשובות נכונות</span></div><div class="stat-box"><strong>${wrong}</strong><span>תשובות שגויות</span></div><div class="stat-box"><strong>${score}%</strong><span>אחוז הצלחה</span></div></div><div class="encouragement">${encouragement(score)}</div><div class="result-record">השיא האישי שלכם בחידון: ${rec?.bestScore??score}/100 · מספר ניסיונות: ${rec?.attempts??1}</div></div>
      <div class="result-actions"><button class="btn btn-primary" type="button" id="retryQuiz">↻ &nbsp;נסו שוב</button><button class="btn btn-secondary" type="button" id="otherQuiz">⇄ &nbsp;לחידון השני</button><button class="btn btn-ghost" type="button" id="chapterMenu">⌂ &nbsp;תפריט הפרק</button></div>
      <div class="tiny-note">בניסיון הבא סדר השאלות והתשובות יתערבב מחדש. השיא האישי נשמר במכשיר זה.</div>
    </section>`;
    $('#retryQuiz').addEventListener('click',()=>startQuiz(state.quizType));
    $('#otherQuiz').addEventListener('click',()=>startQuiz(state.quizType==='pshat'?'rashi':'pshat'));
    $('#chapterMenu').addEventListener('click',renderActivity);
    if(perfect) celebrate();
  }
  function celebrate() {
    const wrap=$('#confetti'); wrap.innerHTML='';
    for(let i=0;i<42;i++) {
      const piece=document.createElement('i');
      piece.style.left=`${Math.random()*100}%`;
      piece.style.animationDelay=`${Math.random()*.65}s`;
      piece.style.animationDuration=`${1.8+Math.random()*1.2}s`;
      piece.style.setProperty('--drift',`${(Math.random()-.5)*180}px`);
      piece.style.background=['#d7a841','#6d8be0','#8b76cf','#43a88e','#e18b79'][i%5];
      wrap.appendChild(piece);
    }
    setTimeout(()=>wrap.innerHTML='',3600);
  }
  $('#brandHome').addEventListener('click',renderHome);
  homeButton.addEventListener('click',renderHome);

  // Lightweight runtime integrity checks for the bundled offline content.
  (function integrityCheck(){
    const total=DB.reduce((sum,c)=>sum+c.questions.length,0);
    const quizzes=DB.reduce((sum,c)=>sum+['pshat','rashi'].filter(t=>c.questions.filter(q=>q.type===t).length===5).length,0);
    const malformed=DB.some(c=>c.questions.length!==10 || c.questions.some(q=>!q.a || q.w.length!==3 || new Set([q.a,...q.w]).size!==4 || !q.source));
    if(total!==40 || quizzes!==8 || malformed) console.error('בדיקת תקינות התוכן נכשלה', {total,quizzes,malformed});
  })();
  renderHome();
  </script>
</body>
</html>
